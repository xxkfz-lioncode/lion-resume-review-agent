# 基础设施：MySQL + Redis + Milvus（含 Etcd 依赖，已去除 MinIO，改用本地磁盘存储）+ 后端服务
# 用法：
#   docker compose up -d --build              # 全部（含后端，首次或改代码后加 --build）
#   docker compose up -d mysql redis          # 仅最小依赖（本地 mvn spring-boot:run 时用）
# 敏感值从项目根目录 .env 读取（cp .env.example .env），也可用 ${VAR:-默认值} 兜底

services:
  mysql:
    image: mysql:8.0
    container_name: resume-mysql
    environment:
      MYSQL_DATABASE: resume_review
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -uroot -proot：健康检查专用，密码随 MYSQL_ROOT_PASSWORD 同步时需一并修改
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:-root} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: resume-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Milvus 向量检索：Etcd(元数据) + Milvus 本体 ----------
  # 已去掉 MinIO：Milvus 通过 COMMON_STORAGETYPE=local 直接用本地磁盘做对象存储
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.0
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 关键：用本地磁盘代替 MinIO/S3 对象存储（官方 standalone_embed.sh 同款写法）
      # 数据落在 /var/lib/milvus/data，由下面 milvus-data 卷持久化
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped

  backend:
    # 不在容器内编译，jar 也不进镜像：宿主机 mvn 打包后运行时挂载
    # 换包只需：mvn -DskipTests package → docker compose restart backend（镜像不用重建）
    build:
      context: .
      dockerfile: Dockerfile
    image: lion-resume-review:1.0.0
    container_name: resume-backend
    environment:
      TZ: Asia/Shanghai
      # 注意：JDBC 串必须用服务名 mysql（容器内 localhost 指向自身），不要复用 .env 里的 MYSQL_URL
      MYSQL_URL: jdbc:mysql://mysql:3306/resume_review?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # 向量检索（默认开启，指向 compose 内的 milvus）
      # 想彻底关掉：.env 里设 VECTORSTORE_TYPE=none，Spring AI 不创建 MilvusVectorStore，
      # 业务层 @Autowired(required=false) 会自动跳过，此时可不再启动 milvus/etcd
      VECTORSTORE_TYPE: ${VECTORSTORE_TYPE:-milvus}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-}
      LANGFUSE_AUTH_BASIC: ${LANGFUSE_AUTH_BASIC:-}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    volumes:
      # 预构建 jar 只读挂载（路径不对时容器会提示 /app/app.jar not found）
      - ${JAR_FILE:-./target/resume-review-1.0.0.jar}:/app/app.jar:ro
      - backend-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  milvus-data:
  backend-data:
